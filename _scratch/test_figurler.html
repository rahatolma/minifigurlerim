eşfetmek ve heyecanlanmak.”\",\"box3Content\":\"Seri 17, LEGO’nun hem klasik ruhunu hem yenilikçi yaklaşımını dengelediği bir seridir. Mizah, kahramanlık ve gizem bir arada sunulmuştur.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eCorn\u0026nbsp;Cob\u0026nbsp;Guy,\u0026nbsp;LEGO\u0026nbsp;mizahının\u0026nbsp;modern\u0026nbsp;sembolü\u0026nbsp;haline\u0026nbsp;geldi.\u0026nbsp;Highwayman\u0026nbsp;ise\u0026nbsp;“gizemli\u0026nbsp;figür”\u0026nbsp;konseptinin\u0026nbsp;ne\u0026nbsp;kadar\u0026nbsp;güçlü\u0026nbsp;bir\u0026nbsp;etki\u0026nbsp;yaratabileceğini\u0026nbsp;kanıtladı.\u0026nbsp;Seri\u0026nbsp;17,\u0026nbsp;hem\u0026nbsp;tasarım\u0026nbsp;hem\u0026nbsp;duygusal\u0026nbsp;bağ\u0026nbsp;açısından\u0026nbsp;LEGO’nun\u0026nbsp;en\u0026nbsp;dengeli\u0026nbsp;serilerinden\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71018\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"ae463f52-ff7f-4ae0-a645-7cb84fd57f71\",\"title\":\"LEGO® Minifigürler Serisi 16\",\"slug_tr\":\"lego-minifigurler-serisi-16\",\"slug_en\":\"lego-minifigures-series-16\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2016\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"s2gpm50d4\",\"data\":{\"title\":\"Hayal Dünyasının Kahramanları\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$25e\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Banana Suit Guy, Ice Queen, Spy, Desert Warrior, Mariachi, Dog Show Winner, Hiker, Penguin Boy.\\nBanana Suit Guy, eğlenceli kostümüyle serinin yıldızı oldu. LEGO’nun mizahi tarafını temsil eden bu figür, koleksiyon tarihinin unutulmazlarından biri haline geldi. Ice Queen, zarif tasarımı ve şeffaf detaylarıyla görsel bir şölen sundu. Spy ve Desert Warrior gibi karakterler aksiyon temasını güçlendirirken; Hiker figürü, koleksiyonerler için macera ruhunun sembolü haline geldi.\\n\",\"box2Content\":\"LEGO’nun “kahramanlık” kavramını gündelik hayata taşıdığı dönemdir. Her figür bir arketipi temsil eder; kimi cesareti, kimi eğlenceyi, kimi özgünlüğü simgeler. Bu çeşitlilik, LEGO’nun evrensel bir hikâye anlatıcısına dönüştüğünün göstergesidir.\\n\",\"box3Content\":\"Seri 16, LEGO’nun kahramanlık temasını evrensel boyuta taşıdığı bir seridir. Her karakter, kendi hikâyesinin başrolüdür ve birlikte LEGO’nun hayal dünyasının tamamını oluştururlar.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eBanana\u0026nbsp;Suit\u0026nbsp;Guy,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;simgesi\u0026nbsp;ve\u0026nbsp;LEGO\u0026nbsp;mizahının\u0026nbsp;zirvesidir.\u0026nbsp;Hiker\u0026nbsp;ise\u0026nbsp;detaylı\u0026nbsp;aksesuarlarıyla\u0026nbsp;dönemin\u0026nbsp;en\u0026nbsp;sevilen\u0026nbsp;figürlerinden\u0026nbsp;biri\u0026nbsp;oldu.\u0026nbsp;Seri\u0026nbsp;16,\u0026nbsp;hem\u0026nbsp;eğlenceli\u0026nbsp;hem\u0026nbsp;anlamlı\u0026nbsp;karakterleriyle\u0026nbsp;koleksiyon\u0026nbsp;tarihine\u0026nbsp;adını\u0026nbsp;yazdırdı.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71013\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"43bcd956-175f-45cb-9617-8850d94c15a9\",\"title\":\"LEGO® Minifigürler Serisi 15\",\"slug_tr\":\"lego-minifigurler-serisi-15\",\"slug_en\":\"lego-minifigures-series-15\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2016\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"6w70m5vjp\",\"data\":{\"title\":\"Hayal Gücünün Doruk Noktası\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$25f\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Shark Suit Guy, Queen, Faun, Astronaut, Clumsy Guy, Janitor, Farmer, Tribal Woman.\\nShark Suit Guy, LEGO tarihinin en ikonik kostüm figürlerinden biri haline geldi. Mizahi yönüyle tüm serinin simgesi oldu. Queen, zarif tasarımıyla fantezi temasına görkemli bir dokunuş kazandırdı. Clumsy Guy ve Janitor gibi karakterler ise LEGO’nun gündelik yaşamdan ilham alma becerisini sergiledi. Faun, mitolojik bir figür olarak detay işçiliğiyle öne çıktı.\\n\",\"box2Content\":\"LEGO’nun olgunluk döneminin zirvesidir. Her figür, hem estetik hem de duygusal olarak özenle tasarlanmıştır. Bu seri, markanın mizahı, mitolojiyi ve hayatın içinden detayları aynı çatı altında toplama gücünü gösterir.\",\"box3Content\":\"Seri 15, LEGO’nun yaratıcılıkta sınır tanımadığını kanıtlayan bir seridir. Hem hikâye anlatımı hem tasarım kalitesi açısından markanın “doruk noktası” olarak kabul edilir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eShark\u0026nbsp;Suit\u0026nbsp;Guy,\u0026nbsp;koleksiyon\u0026nbsp;tarihinin\u0026nbsp;en\u0026nbsp;unutulmaz\u0026nbsp;karakterlerinden\u0026nbsp;biridir.\u0026nbsp;Bu\u0026nbsp;seri,\u0026nbsp;LEGO’nun\u0026nbsp;karakter\u0026nbsp;çeşitliliğinde\u0026nbsp;ulaştığı\u0026nbsp;en\u0026nbsp;dengeli\u0026nbsp;dönemdir.\u0026nbsp;Mizah,\u0026nbsp;detay\u0026nbsp;ve\u0026nbsp;hikâye\u0026nbsp;açısından\u0026nbsp;tam\u0026nbsp;bir\u0026nbsp;başyapıttır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71011\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"524512a3-08cc-4346-844e-30e127cd114d\",\"title\":\"LEGO® Minifigürler Serisi 14\",\"slug_tr\":\"lego-minifigurler-serisi-14\",\"slug_en\":\"lego-minifigures-series-14\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2015\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"fcxcm9ur2\",\"data\":{\"title\":\"Canavarlar Serbest!\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$260\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Zombie Cheerleader, Plant Monster, Werewolf, Monster Scientist, Witch, Specter, Gargoyle, Skeleton Guy.\\nZombie Cheerleader, hem renkli hem de karanlık atmosferiyle dikkat çekti. Plant Monster, LEGO’nun doğa temalı korku figürlerinden biri olarak özgün bir tasarım sundu. Monster Scientist, klasik Frankenstein göndermesiyle nostalji yarattı. Witch ve Specter gibi karakterler ise seriye gotik bir derinlik kattı.\\n\",\"box2Content\":\"LEGO’nun tematik cesaretinin kanıtıdır. Seri 14, markanın sadece eğlenceli değil, atmosferik hikâyeler de anlatabileceğini gösterdi. Korku temasını eğlenceli bir dille işleyerek hem çocukları hem yetişkin koleksiyoncuları yakaladı.\",\"box3Content\":\"Seri 14, LEGO’nun yaratıcılığının en özgün yansımalarından biridir. Korku ve mizahı mükemmel dengeyle harmanlayan bu seri, LEGO’nun sınırlarını aşma cesaretini simgeler.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003ePlant\u0026nbsp;Monster\u0026nbsp;ve\u0026nbsp;Zombie\u0026nbsp;Cheerleader,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;dikkat\u0026nbsp;çeken\u0026nbsp;figürlerindendir.\u0026nbsp;Özellikle\u0026nbsp;Plant\u0026nbsp;Monster,\u0026nbsp;özgün\u0026nbsp;tasarımıyla\u0026nbsp;koleksiyon\u0026nbsp;tarihine\u0026nbsp;geçti.\u0026nbsp;Seri\u0026nbsp;14,\u0026nbsp;LEGO’nun\u0026nbsp;tematik\u0026nbsp;derinlik\u0026nbsp;yaratma\u0026nbsp;gücünün\u0026nbsp;en\u0026nbsp;güzel\u0026nbsp;örneklerinden\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71010\",\"rarity\":\"Çok Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"7edbbbf0-6c4d-4beb-9b9f-b9f76f621d08\",\"title\":\"LEGO® Minifigürler Serisi 13\",\"slug_tr\":\"lego-minifigurler-serisi-13\",\"slug_en\":\"lego-minifigures-series-13\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2015\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"p7rjsfftr\",\"data\":{\"title\":\"Hayal Gücü Genişliyor\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$261\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Unicorn Girl, Hot Dog Man, King, Samurai, Evil Wizard, Snake Charmer, Paleontologist, Carpenter.\\n\\nHot Dog Man, LEGO’nun mizahi figürleri arasında efsaneleşti ve kısa sürede kült statüsüne ulaştı. Unicorn Girl, kostüm temalı figürlerin sevimli yüzü olarak geniş bir hayran kitlesi kazandı. Evil Wizard ve King gibi karakterler, klasik LEGO fantezi temasını modern tasarım anlayışıyla buluşturdu.\\n\",\"box2Content\":\"LEGO’nun artık tamamen özgürleştiği, hayal gücünün sınırlarını ortadan kaldırdığı bir dönemi temsil ediyor. Her karakter, farklı bir duyguya, tarza veya hikâyeye hitap ediyor. Bu çeşitlilik, LEGO’nun evrensel bir anlatım dili kurduğunun göstergesi.\",\"box3Content\":\"Seri 13, LEGO’nun olgunlukla yaratıcılığı harmanladığı bir seri oldu. Hem mizahi hem fantastik figürleriyle geniş bir hayal gücü yelpazesi sundu.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eHot\u0026nbsp;Dog\u0026nbsp;Man,\u0026nbsp;koleksiyon\u0026nbsp;tarihinin\u0026nbsp;en\u0026nbsp;tanınan\u0026nbsp;kostüm\u0026nbsp;figürlerinden\u0026nbsp;biridir.\u0026nbsp;Bu\u0026nbsp;seri,\u0026nbsp;LEGO’nun\u0026nbsp;yaratıcılığının\u0026nbsp;doruğa\u0026nbsp;ulaştığı\u0026nbsp;ve\u0026nbsp;hayal\u0026nbsp;gücünü\u0026nbsp;herkesin\u0026nbsp;ulaşabileceği\u0026nbsp;bir\u0026nbsp;boyuta\u0026nbsp;taşıdığı\u0026nbsp;dönemdir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71008\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"896e92cf-4b82-4b04-8135-b85ac5d45ad8\",\"title\":\"LEGO® Minifigürler Serisi 12\",\"slug_tr\":\"lego-minifigurler-serisi-12\",\"slug_en\":\"lego-minifigures-series-12\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2014\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"dw0xnoqw8\",\"data\":{\"title\":\"Sahne Senin\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$262\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Wizard, Battle Goddess, Space Miner, Piggy Guy, Jester, Pizza Delivery Guy, Video Game Guy, Genie Girl.\\n\\nBattle Goddess, güçlü duruşu ve detaylı zırhı ile LEGO’nun kadın savaşçı temalarını öne çıkardığı figürlerden biri oldu. Piggy Guy ise kostüm temalı figürlerde mizahi bir kilometre taşı haline geldi. Wizard karakteri, klasik fantezi temasını büyüleyici detaylarla yeniden canlandırdı.\",\"box2Content\":\"LEGO’nun “karakter performansı” dönemidir. Her figür bir sahnenin yıldızı gibiydi. Sahne ışıkları bu kez minifigürlerin üzerindeydi ve her biri kendi hikâyesini anlatıyordu. LEGO’nun yaratıcılığı, mizah ve karakter derinliği bu seride mükemmel bir dengeye ulaştı.\\n\",\"box3Content\":\"Seri 12, LEGO’nun hikâye anlatıcılığını bir üst seviyeye taşıdığı özel bir seridir. Hem dijital hem fiziksel dünyada yer alan karakterleriyle koleksiyonculuk deneyimine yeni bir boyut kazandırdı.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003ePiggy\u0026nbsp;Guy\u0026nbsp;ve\u0026nbsp;Battle\u0026nbsp;Goddess,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;unutulmaz\u0026nbsp;karakterleridir.\u0026nbsp;Mizah\u0026nbsp;ve\u0026nbsp;kahramanlık\u0026nbsp;temalarının\u0026nbsp;buluştuğu\u0026nbsp;bu\u0026nbsp;dönem,\u0026nbsp;LEGO’nun\u0026nbsp;modern\u0026nbsp;çağa\u0026nbsp;uyum\u0026nbsp;sağlarken\u0026nbsp;ruhunu\u0026nbsp;koruduğu\u0026nbsp;bir\u0026nbsp;aşamaydı.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71007\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"094183cf-5952-449b-98c9-3188244a86e2\",\"title\":\"LEGO® Minifigürler Serisi 11\",\"slug_tr\":\"lego-minifigurler-serisi-11\",\"slug_en\":\"lego-minifigures-series-11\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2013\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"haqs4vfpz\",\"data\":{\"title\":\"Günlük Hayatın Kahramanları \",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$263\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Constable, Welder, Pretzel Girl, Scientist, Grandma, Evil Mech, Gingerbread Man, Barbarian.\\n\\nGingerbread Man, mizahi yönüyle bu serinin sembolü haline geldi. Tatlı bir yılbaşı havası taşıyan bu figür, LEGO’nun sıcak ve eğlenceli yönünü temsil etti. Grandma, minifigür tarihinde ilk kez bir büyükanne karakterini tanıtarak çeşitliliği artırdı. Evil Mech, fütüristik zırh tasarımıyla dikkat çekti. Pretzel Girl ise kültürel bir figür olarak LEGO’ya geleneksel bir dokunuş kazandırdı.\\n\",\"box2Content\":\"LEGO’nun “olağan”ı özel hale getirdiği bir dönemi temsil ediyor. Her figür, günlük yaşamın içinden gelen bir hikâye taşıyor; küçük detaylar büyük anlamlar yaratıyor. Bu seride kahramanlık, dev canavarları yenmekte değil, gündelik yaşamın parçası olmada saklıydı.\\n\",\"box3Content\":\"Seri 11, LEGO’nun insan odaklı hikâye anlatımını güçlendirdiği bir seri oldu. Hayal gücü ile gerçeklik arasındaki çizgiyi ustalıkla birleştirdi.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eGingerbread\u0026nbsp;Man,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;ikonik\u0026nbsp;karakteri\u0026nbsp;haline\u0026nbsp;geldi.\u0026nbsp;Hem\u0026nbsp;mizahı\u0026nbsp;hem\u0026nbsp;sıcak\u0026nbsp;tasarımıyla\u0026nbsp;koleksiyoncuların\u0026nbsp;favorilerinden\u0026nbsp;biri\u0026nbsp;oldu.\u0026nbsp;Seri\u0026nbsp;11,\u0026nbsp;LEGO’nun\u0026nbsp;insana\u0026nbsp;ve\u0026nbsp;gündelik\u0026nbsp;hayata\u0026nbsp;dokunduğu\u0026nbsp;özel\u0026nbsp;serilerden\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71002\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":2,\"title_en\":\"\"},{\"id\":\"4eab2c19-01c6-403e-b2f0-e9b5d9a892ad\",\"title\":\"LEGO® Minifigürler Serisi 10\",\"slug_tr\":\"lego-minifigurler-serisi-10\",\"slug_en\":\"lego-minifigures-series-10\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2013\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":\"https://hmzgccvwgrgrgkudvljb.supabase.co/storage/v1/object/public/minifigure-images/series/yd9s22v7nt.webp\",\"content_blocks\":[{\"id\":\"jotfq1pfo\",\"data\":{\"title\":\"Altın Avı\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$264\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Medusa, Revolutionary Soldier, Bumblebee Girl, Librarian, Paintball Player, Sea Captain, Sad Clown, Roman Commander.\\n\\nMedusa, özel kalıp tasarımıyla LEGO tarihindeki en dikkat çekici karakterlerden biri haline geldi. Revolutionary Soldier ve Roman Commander gibi tarihsel figürler, detaylı baskılarıyla öne çıktı. Sad Clown, sade ama derin yüz ifadesiyle koleksiyoncuların duygusal favorisi oldu.\\nAncak tüm bunların arasında en çok konuşulan elbette gizli figür Mr. Gold idi.\",\"box2Content\":\"LEGO’nun koleksiyon kültürünü “macera”ya dönüştürdüğü andır. Artık her figür bir karakter olmanın ötesine geçip bir keşif unsuru haline gelmişti. Seri 10, koleksiyonerleri yalnızca toplamakla değil, aramakla da buluşturdu.\",\"box3Content\":\"Seri 10, LEGO tarihinin dönüm noktalarından biridir. Gizli figür konseptiyle birlikte LEGO, koleksiyonculuğa oyunlaştırma ruhunu kattı. Bu seri, hem sembolik değeri hem de koleksiyonculara yaşattığı heyecanla unutulmazlar arasındadır.\\n\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eMr.\u0026nbsp;Gold,\u0026nbsp;LEGO\u0026nbsp;tarihinin\u0026nbsp;en
