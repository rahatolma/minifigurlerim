_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"lw9mog5v7\",\"data\":{\"title\":\"Spider-Man: Across the Spider-Verse\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$234\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Miles Morales, Gwen Stacy (Spider-Gwen), Spider-Man 2099 (Miguel O’Hara), Spider-Punk (Hobart Brown), Spider-Man India (Pavitr Prabhakar), The Spot, Peter B. Parker, Mayday Parker, Jessica Drew (Spider-Woman), Scarlet Spider (Ben Reilly).\\nMiles Morales, kırmızı-siyah kostümü ve enerjik duruşuyla serinin merkezinde yer alır.\\nSpider-Gwen, zarif kostüm detayları ve pastel renk geçişleriyle serinin estetik figürüdür.\\nSpider-Man 2099, kaslı gövdesi ve mavi tonlarıyla geleceğin karanlık evrenini temsil eder.\\nSpider-Punk, gitar aksesuarı ve asi tavrıyla koleksiyonun rock yıldızıdır.\\nThe Spot, beyaz kostümü ve portal efekt baskılarıyla çoklu evrenin kaotik enerjisini taşır.\\nMayday Parker, minifigür ölçeğinde bile şirinliğiyle serinin en sevimli detayıdır.\",\"box2Content\":\"LEGO’nun sanatı, aksiyonu ve duyguyu aynı koleksiyonda buluşturduğu dönemi temsil eder.\\nHer karakter, farklı bir dünyadan gelse de aynı ideali paylaşır: cesaret, sorumluluk ve umut.\\nLEGO bu seriyle “çoklukta birlik” fikrini minifigür diliyle anlatmıştır.\",\"box3Content\":\"Spider-Man: Across the Spider-Verse Serisi, LEGO’nun çoklu evren anlatımındaki ustalığını gösteren yenilikçi bir koleksiyondur.\\nHer figür, hem karakter gelişimi hem de görsel detay açısından bir sanat çalışması gibidir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSpider-Man\u0026nbsp;2099\u0026nbsp;ve\u0026nbsp;Spider-Punk,\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;çok\u0026nbsp;aranan\u0026nbsp;karakterlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri,\u0026nbsp;stilize\u0026nbsp;çizim\u0026nbsp;anlayışını\u0026nbsp;tuğla\u0026nbsp;estetiğiyle\u0026nbsp;buluşturarak\u0026nbsp;LEGO’nun\u0026nbsp;modern\u0026nbsp;sinema\u0026nbsp;adaptasyonlarındaki\u0026nbsp;cesaretini\u0026nbsp;ortaya\u0026nbsp;koyar.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71050\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":3,\"title_en\":\"\"},{\"id\":\"efa8c1b6-1406-4b2e-9f59-c26e9b484ee2\",\"title\":\"LEGO® Minifigürler Serisi F1 Race Cars\",\"slug_tr\":\"lego-minifigurler-serisi-f1-race-cars\",\"slug_en\":\"lego-minifigures-series-f1-race-cars\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2025\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"f3kmchs6n\",\"data\":{\"title\":\"F1 Race Cars\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$235\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"F1 Driver, Rookie Driver, Pit Crew Chief, Race Engineer, Team Principal, Test Driver, Safety Car Driver, Track Marshal, Tire Specialist, Podium Winner.\\n\\nF1 Driver, tam donanımlı kaskı ve yarış tulumuyla serinin merkez karakteridir.\\nRookie Driver, genç ve iddialı duruşuyla geleceğin şampiyonlarını temsil eder.\\nPit Crew Chief ve Tire Specialist, yarışın kaderini belirleyen stratejik anların arkasındaki gizli kahramanlardır.\\nRace Engineer, telsiz aksesuarı ve teknik ekipmanlarıyla mühendislik tarafını sahneye çıkarır.\\nPodium Winner ise zafer anını simgeleyen kupasıyla serinin zirve figürüdür.\",\"box2Content\":\"LEGO’nun “hız ve rekabet” temasını minifigür diliyle en dengeli şekilde yorumladığı koleksiyonlardan biridir.\\nHer karakter, pistteki farklı bir rolü temsil eder — hız, strateji ve takım ruhu bu serinin temelini oluşturur.\\n\\nLEGO, bu seriyle yarış dünyasının sadece görünen yüzünü değil, arka plandaki emeği ve koordinasyonu da anlatır.\",\"box3Content\":\"F1 Race Cars Serisi, LEGO’nun spor temalı anlatımını daha teknik ve gerçekçi bir boyuta taşıdığı enerjik bir koleksiyondur.\\nHer figür, yarış dünyasının farklı bir parçasını temsil eder ve birlikte bütün bir hikâye oluşturur.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"color: rgb(0, 0, 0);\\\"\u003eF1\u0026nbsp;Driver\u0026nbsp;ve\u0026nbsp;Podium\u0026nbsp;Winner\u0026nbsp;figürleri\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;dikkat\u0026nbsp;çeken\u0026nbsp;parçalarıdır.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"color: rgb(0, 0, 0);\\\"\u003ePit\u0026nbsp;Crew\u0026nbsp;ve\u0026nbsp;Engineer\u0026nbsp;karakterleri\u0026nbsp;ise\u0026nbsp;koleksiyona\u0026nbsp;derinlik\u0026nbsp;katar.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"color: rgb(0, 0, 0);\\\"\u003eBu\u0026nbsp;seri,\u0026nbsp;LEGO’nun\u0026nbsp;hız\u0026nbsp;temasını\u0026nbsp;sadece\u0026nbsp;görsel\u0026nbsp;değil,\u0026nbsp;anlatısal\u0026nbsp;olarak\u0026nbsp;da\u0026nbsp;güçlendirdiği\u0026nbsp;modern\u0026nbsp;bir\u0026nbsp;koleksiyondur.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71049\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"29fd1eed-95ef-4056-b749-e507717e775f\",\"title\":\"LEGO® Minifigürler Serisi Dungeons and Dragons\",\"slug_tr\":\"lego-minifigurler-serisi-dungeons-and-dragons\",\"slug_en\":\"lego-minifigures-series-dungeons-and-dragons\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2024\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"mph6m9j8w\",\"data\":{\"title\":\"Dungeons \u0026 Dragons\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$236\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Dwarf Barbarian, Tiefling Sorcerer, Elf Ranger, Orc Rogue, Human Paladin, Dragonborn Cleric, Gnome Artificer, Mind Flayer, Skeleton Warrior, Bard, Beholder Companion, Dungeon Master.\\nDwarf Barbarian, ağır baltası ve savaş yeleğiyle serinin kas gücünü temsil eder.\\nTiefling Sorcerer, yarı iblis kökeni ve büyü efektleriyle mistik bir hava taşır.\\nElf Ranger, zarif yayı ve doğayla kurduğu bağ sayesinde dengeyi temsil eder.\\nMind Flayer, Lovecraft esintili tasarımıyla seriye gotik bir derinlik katar.\\nDungeon Master figürü ise serinin ruhunu — hikâyeyi yöneten gücü — sembolize eder.\",\"box2Content\":\"LEGO’nun fantezi anlatımındaki ustalığının zirvesidir.\\nHer figür, bir hikâyenin kahramanı ya da kötüsüdür; oyuncunun hayalinde canlanmayı bekleyen bir karakterdir.\\nBu seriyle LEGO, koleksiyonculuğu adeta masaüstü maceracılığa dönüştürmüştür.\",\"box3Content\":\"Dungeons \u0026 Dragons Serisi, LEGO’nun hayal gücüyle mitolojik kahramanlık temasını birleştirdiği efsanevi bir koleksiyondur.\\nRenk, karakter ve tema çeşitliliğiyle hem RPG kültürünü hem de LEGO’nun hikâye geleneğini onurlandırır.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eDwarf\u0026nbsp;Barbarian\u0026nbsp;ve\u0026nbsp;Mind\u0026nbsp;Flayer,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;dikkat\u0026nbsp;çeken\u0026nbsp;figürlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri,\u0026nbsp;detay\u0026nbsp;seviyesi,\u0026nbsp;tematik\u0026nbsp;derinliği\u0026nbsp;ve\u0026nbsp;karakter\u0026nbsp;çeşitliliğiyle\u0026nbsp;LEGO’nun\u0026nbsp;fantezi\u0026nbsp;evrenindeki\u0026nbsp;yeni\u0026nbsp;çağını\u0026nbsp;temsil\u0026nbsp;eder.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71047\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"b503a707-8a9f-4c87-95ac-85bd33230641\",\"title\":\"LEGO® Minifigürler Serisi Marvel Studios 2\",\"slug_tr\":\"lego-minifigurler-serisi-marvel-studios-2\",\"slug_en\":\"lego-minifigures-series-marvel-studios-2\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2023\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"ocy3a014s\",\"data\":{\"title\":\"Marvel Studios 2\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$237\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Moon Knight, Mr. Knight, She-Hulk, Wolverine, Storm, Beast, Echo, Kate Bishop, Hawkeye, Goliath, Werewolf by Night, Agatha Harkness.\\nMoon Knight, beyaz kostümü ve çift kimliğiyle serinin en dikkat çekici figürüdür.\\nShe-Hulk, mizah dolu kişiliğiyle Marvel’ın hukuk temalı dizisini LEGO formuna taşır.\\nWolverine, X-Men evreninin yeniden doğuşunu simgeleyen ikonik pençeleriyle seriye nostaljik bir güç katar.\\nAgatha Harkness, büyü efektleriyle karanlık mizahın en estetik temsilidir.\\nKate Bishop ve Hawkeye ikilisi, ustalık ve gençlik enerjisini aynı sahnede buluşturur.\",\"box2Content\":\"LEGO’nun “çoklu evrende düzen kurma” başarısının kanıtıdır.\\nHer karakter, kahramanlığın farklı bir yorumunu temsil eder: kaos, mizah, güç, denge veya kefaret.\\nLEGO, bu seride Marvel’ın modern yüzünü minifigürlerle ölümsüzleştirmiştir.\",\"box3Content\":\"Marvel Studios Seri 2, LEGO’nun kahramanlık temasında ulaştığı olgunluk dönemidir.\\nDetay seviyesi, karakter seçimi ve sinematik sadakatiyle hem Marvel hem LEGO koleksiyoncuları için bir başyapıttır.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eMoon\u0026nbsp;Knight\u0026nbsp;ve\u0026nbsp;Wolverine,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;çok\u0026nbsp;aranan\u0026nbsp;figürleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;2,\u0026nbsp;LEGO’nun\u0026nbsp;çizgi\u0026nbsp;roman\u0026nbsp;mirasıyla\u0026nbsp;modern\u0026nbsp;sinema\u0026nbsp;estetiğini\u0026nbsp;kusursuz\u0026nbsp;biçimde\u0026nbsp;harmanladığı\u0026nbsp;bir\u0026nbsp;dönüm\u0026nbsp;noktasıdır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71039\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"cbe24d8a-cea0-49fb-a15a-63dc8795cf53\",\"title\":\"LEGO® Minifigürler Serisi Disney 100\",\"slug_tr\":\"lego-minifigurler-serisi-disney-100\",\"slug_en\":\"lego-minifigures-series-disney-100\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2023\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"eclw73kz1\",\"data\":{\"title\":\"Disney 100\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$238\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Sorcerer Mickey (Fantasia), Oswald the Lucky Rabbit, Pinocchio, Jiminy Cricket, Snow White, Evil Queen, Tiana, Dr. Facilier, Mulan, Aurora (Uyuyan Güzel), Ernesto de la Cruz (Coco), Miguel (Coco), Pocahontas, Baymax, Stitch (4 Arms), Cruella de Vil, Robin Hood, Prince John.\\nSorcerer Mickey, “Fantasia” filmindeki büyülü şapka ve sihir aksesuarıyla Disney tarihinin özünü temsil eder.\\nOswald the Lucky Rabbit, Mickey’den önce doğmuş ilk Disney karakteri olarak seriye tarihsel derinlik katar.\\nMiguel ve Ernesto de la Cruz, “Coco” filminin müzik dolu ruhunu LEGO formunda yaşatır.\\nEvil Queen ve Cruella de Vil, Disney’in unutulmaz kötü karakterlerini zarafetle taşır.\\nBaymax, modern dönemin en sempatik kahramanı olarak klasiklerle moderni buluşturur.\",\"box2Content\":\"LEGO’nun “100 yıllık hayal gücüne minifigür saygı duruşu”dur.\\nHer karakter, Disney’in farklı dönemlerinden gelen bir duyguyu temsil eder — çocukluk, umut, cesaret veya yaratıcılık.\\nBu koleksiyon, LEGO’nun hikâye anlatımını sinema tarihine bağladığı zirve noktasıdır.\",\"box3Content\":\"Disney 100 Serisi, LEGO’nun tasarım gücünü, Disney’in büyüsüyle birleştirdiği anıtsal bir koleksiyondur.\\nHem geçmişe saygı hem geleceğe ilham taşıyan bu seri, koleksiyon dünyasında özel bir kutlama sayfası açar.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSorcerer\u0026nbsp;Mickey\u0026nbsp;ve\u0026nbsp;Oswald,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;kalbini\u0026nbsp;oluşturur.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eDisney\u0026nbsp;100,\u0026nbsp;LEGO’nun\u0026nbsp;“her\u0026nbsp;figür\u0026nbsp;bir\u0026nbsp;anı,\u0026nbsp;her\u0026nbsp;anı\u0026nbsp;bir\u0026nbsp;hikâye”\u0026nbsp;felsefesinin\u0026nbsp;en\u0026nbsp;parlak\u0026nbsp;yansımasıdır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71038\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"720266e0-4054-4952-a704-badd9b252a49\",\"title\":\"LEGO® Minifigürler Serisi Super Mario Character Packs 5\",\"slug_tr\":\"lego-minifigurler-serisi-super-mario-character-packs-5\",\"slug_en\":\"lego-minifigures-series-super-mario-character-packs-5\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2022\",\"category\":\"Özel Seriler\",\"category_main\":\"Özel Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"whypxesip\",\"data\":{\"title\":\"Super Mario Character Packs Seri 5\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$239\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Nabbit, Hammer Bro, Toady, Red Yoshi, Blue Shy Guy, Waddlewing, Baby Yoshi, Cat Goomba.\\nNabbit, oyun serisinin en özgün karakterlerinden biri olarak koleksiyonun yıldızıdır.\\nRed Yoshi ve Baby Yoshi, renkli tasarımlarıyla Super Mario evrenine sıcak bir enerji katar.\\nHammer Bro ve Toady gibi karakterler ise klasik oyun nostaljisini LEGO dünyasında yeniden canlandırır.\\nHer biri, küçük boyutuna rağmen inanılmaz detay seviyesine sahiptir.\",\"box2Content\":\"LEGO’nun “oyun ve koleksiyon” dünyalarını birleştirdiği noktadır.\\nSuper Mario figürleri yalnızca birer karakter değil, aynı zamanda çocukluk anılarının ve eğlenceli mücadelelerin simgesidir.\",\"box3Content\":\"Super Mario Character Packs Seri 5, hem interaktif yapısıyla hem de karakter zenginliğiyle LEGO tarihinin en enerjik lisanslı serilerinden biridir.\\nHer figür, Mario dünyasının bir parçasını LEGO dilinde anlatır.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eNabbit\u0026nbsp;ve\u0026nbsp;Red\u0026nbsp;Yoshi,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;dikkat\u0026nbsp;çeken\u0026nbsp;karakterleridir.\u0026nbsp;Renk,\u0026nbsp;detay\u0026nbsp;ve\u0026nbsp;oyunla\u0026nbsp;bütünleşme\u0026nbsp;açısından\u0026nbsp;benzersizdir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;5,\u0026nbsp;Super\u0026nbsp;Mario\u0026nbsp;hayranları\u0026nbsp;için\u0026nbsp;hem\u0026nbsp;nostaljik\u0026nbsp;hem\u0026nbsp;yenilikçi\u0026nbsp;bir\u0026nbsp;deneyim\u0026nbsp;sunar.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71410\",\"rarity\":\"Yaygın\",\"figure_count\":8,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"83379721-5b6b-46a1-b5e1-ae2329a28a74\",\"title\":\"LEGO® Minifigürler Serisi The Muppets\",\"slug_tr\":\"lego-minifigurler-serisi-the-muppets\",\"slug_en\":\"lego-minifigures-series-the-muppets\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2022\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"135o53w4n\",\"data\":{\"title\":\"The Muppets\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$23a\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Kermit the Frog, Miss Piggy, Fozzie Bear, Gonzo, Animal, Statler, Waldorf, Rowlf the Dog, Swedish Chef, Dr. Bunsen Honeydew, Beaker, Janice.\\nKermit the Frog, elindeki banjo ve huzurlu yüz ifadesiyle serinin kalbidir — Muppet felsefesinin “iyi niyetli mizah” ruhunu taşır.\\nMiss Piggy, sahne ışıklarıyla buluşan özgüvenin simgesidir.\\nAnimal, davul setiyle enerjik kişiliğini LEGO evrenine taşır.\\nStatler ve Waldorf, sahne balkonundaki unutulmaz yorumlarıyla koleksiyonun mizahi yanını öne çıkarır.\\nSwedish Chef ise esprili aksesuarlarıyla seriye mutfak komedisi havası katar.\",\"box2Content\":\"LEGO’nun eğlence tarihine duyduğu saygının bir göstergesidir.\\nHer karakter, bir gülümsemenin, bir repliğin ya da bir melodinin minyatür halidir.\\nLEGO bu seriyle sadece karakterleri değil, sahne kültürünün ruhunu da koleksiyonlaştırmıştır.\",\"box3Content\":\"The Muppets Serisi, LEGO’nun mizahı ve nostaljiyi en saf haliyle buluşturduğu koleksiyonudur.\\nRenkli karakterler, ikonlaşmış sahneler ve detaylı kalıplarla televizyon tarihine saygı duruşunda bulunur.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eKermit\u0026nbsp;ve\u0026nbsp;Animal,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;ikonik\u0026nbsp;figürlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eThe\u0026nbsp;Muppets\u0026nbsp;Serisi,\u0026nbsp;LEGO’nun\u0026nbsp;“sadece\u0026nbsp;figür\u0026nbsp;değil,\u0026nbsp;anı\u0026nbsp;üretme”\u0026nbsp;vizyonunun\u0026nbsp;en\u0026nbsp;tatlı\u0026nbsp;örneklerinden\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71033\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"f96f8c95-387d-4881-9373-5b1a22a6da46\",\"title\":\"LEGO® Minifigürler Serisi Super Mario Character Packs 4\",\"slug_tr\":\"lego-minifigurler-serisi-super-mario-character-packs-4\",\"slug_en\":\"lego-minifigures-series-super-mario-character-packs-4\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2022\",\"category\":\"Özel Seriler\",\"category_main\":\"Özel Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"kgdiow4qs\",\"data\":{\"title\":\"Super Mario Character Packs Seri 4\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$23b\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Bee Mario, Bully, Scaredy Rat, Ant Trooper, Galoomba, Parachute Bob-omb, Mechakoopa, Freezie.\\nBee Mario, bu serinin en sevimli ve işlevsel karakterlerinden biridir.\\nKlasik Mario formuna yeni bir kostüm kazandıran bu figür, hem oynanabilirlik hem de nostalji açısından öne çıkar.\\nBully ve Mechakoopa, serinin aksiyon dozunu artırırken; Galoomba ve Freezie gibi karakterler oyun dünyasının klasik düşmanlarını LEGO evrenine taşır.\",\"box2Content\":\"LEGO’nun Super Mario konseptini “oyunlaştırılmış koleksiyon” haline getirdiği andır.\\nArtık her karakter yalnızca bir figür değil, interaktif bir hikâye parçasıdır.\\nBu yaklaşım, LEGO’nun eğlenceyi tasarım estetiğiyle nasıl harmanlayabileceğini gösterir.\",\"box3Content\":\"Super Mario Character Packs Seri 4, hem klasik hem modern Mario dünyasını birleştiren köprü seridir.\\nOyunla koleksiyonun kesiştiği bu noktada LEGO, eğlencenin sınırlarını bir kez daha genişletmiştir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eBee\u0026nbsp;Mario\u0026nbsp;ve\u0026nbsp;Mechakoopa,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;ikonik\u0026nbsp;figürleri\u0026nbsp;olarak\u0026nbsp;öne\u0026nbsp;çıkar.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;4,\u0026nbsp;hem\u0026nbsp;detay\u0026nbsp;kalitesi\u0026nbsp;hem\u0026nbsp;de\u0026nbsp;interaktif\u0026nbsp;tasarımıyla\u0026nbsp;Mario\u0026nbsp;evreninin\u0026nbsp;LEGO’da\u0026nbsp;en\u0026nbsp;dolu\u0026nbsp;yansımalarından\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71402\",\"rarity\":\"Yaygın\",\"figure_count\":10,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"2c9d42a2-d71c-476a-8421-6fa1997966f7\",\"title\":\"LEGO® Minifigürler Serisi VIDIYO Bandmates 2\",\"slug_tr\":\"lego-minifigurler-serisi-vidiyo-bandmates-2\",\"slug_en\":\"lego-minifigures-series-vidiyo-bandmates-2\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2021\",\"category\":\"Özel Seriler\",\"category_main\":\"Özel Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"yzn5jfoqe\",\"data\":{\"title\":\"VIDIYO Bandmates Seri 2\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$23c\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"DJ Captain, Alien Singer, Vampire Bassist, Leopard Guitarist, Genie Dancer, Dragon Guitarist, Banshee Singer, Fairy Singer.\\nDragon Guitarist ve Alien Singer, sahne ışıklarını domine eden güçlü figürler olarak öne çıktı.\\nLeopard Guitarist, kostüm detaylarıyla LEGO’nun müzik temasındaki mizah anlayışını temsil etti.\\nBanshee Singer ise rock ve gotik atmosferiyle seriye dramatik bir derinlik kattı.\\nHer karakterin “BeatBits” aksesuarı, sahne performansına özel dijital efektleri aktifleştiriyordu.\",\"box2Content\":\"LEGO’nun müziği sadece duymak değil, “görmek ve yaşamak” olarak tanımladığı andır.\\nHer karakter bir tarzı, bir enerjiyi, bir müzik türünü temsil eder.\\nBu da seriyi sadece eğlenceli değil, kültürel olarak da çok katmanlı hale getirir.\",\"box3Content\":\"VIDIYO Bandmates Seri 2, LEGO’nun dijital çağda koleksiyonculuğu yeniden tanımladığı bir seridir.\\nMüzik, teknoloji ve tasarımın buluştuğu bu renkli dünya, yaratıcılığın ritmini yansıtır.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eDragon\u0026nbsp;Guitarist\u0026nbsp;ve\u0026nbsp;Genie\u0026nbsp;Dancer,\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;dikkat\u0026nbsp;çeken\u0026nbsp;figürleri\u0026nbsp;arasındadır.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;2,\u0026nbsp;LEGO’nun\u0026nbsp;müzik\u0026nbsp;temasına\u0026nbsp;kattığı\u0026nbsp;dijital\u0026nbsp;boyutla\u0026nbsp;benzersiz\u0026nbsp;bir\u0026nbsp;deneyim\u0026nbsp;sunar\u0026nbsp;—\u0026nbsp;sahneye\u0026nbsp;çıkan\u0026nbsp;her\u0026nbsp;figür,\u0026nbsp;bir\u0026nbsp;ritmin\u0026nbsp;parçasıdır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"43108\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"2f77a03b-47e6-41f9-bcf0-8ccf68c4b4da\",\"title\":\"LEGO® Minifigürler Serisi Marvel Studios\",\"slug_tr\":\"lego-minifigurler-serisi-marvel-studios\",\"slug_en\":\"lego-minifigures-series-marvel-studios\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2021\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"pqhflsxk6\",\"data\":{\"title\":\"Marvel Studios\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$23d\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"The Scarlet Witch (WandaVision), Vision (White Vision), Monica Rambeau, Captain America (Sam Wilson), Winter Soldier (Bucky Barnes), Loki, Sylvie, Alligator Loki, Spider-Man (Zombie Hunter), Zombie Captain America, T’Challa Star-Lord, Captain Carter, Gamora (Blade of Thanos).\\nScarlet Witch, büyü efektleriyle serinin görsel açıdan en çarpıcı figürüdür.\\nCaptain Carter, alternatif bir gerçekliğin “kadın süper asker” vizyonunu LEGO formunda temsil eder.\\nLoki ve Alligator Loki ikilisi, mizahi yönüyle seriye karakter kazandırır.\\nZombie Captain America ve Zombie Hunter Spidey, LEGO’nun karanlık ama eğlenceli yönünü öne çıkarır.\\nT’Challa Star-Lord, farklı evrenlerin birleşimini simgeleyen nadir bir figürdür.\",\"box2Content\":\"LEGO’nun “çoklu evreni minifigürlerle açıklayabildiği” andır.\\nHer karakter, alternatif bir kaderin ya da hikâyenin yansımasıdır.\\nBu seri, kahramanlık kavramını LEGO’nun mizahi ve yaratıcı anlatımıyla yeniden tanımlar.\",\"box3Content\":\"Marvel Studios Serisi, LEGO’nun sinematik hikâye anlatımında ulaştığı en geniş evrendir.\\nHer figür, hem Marvel dizilerine bir selam hem de LEGO’nun karakter derinliğine verdiği önemin göstergesidir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eScarlet\u0026nbsp;Witch\u0026nbsp;ve\u0026nbsp;Captain\u0026nbsp;Carter,\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;çok\u0026nbsp;aranan\u0026nbsp;figürlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;1,\u0026nbsp;LEGO’nun\u0026nbsp;Marvel\u0026nbsp;dünyasına\u0026nbsp;adım\u0026nbsp;atarken\u0026nbsp;ulaştığı\u0026nbsp;detay\u0026nbsp;ve\u0026nbsp;kalite\u0026nbsp;seviyesinin\u0026nbsp;sembolüdür\u0026nbsp;—\u0026nbsp;her\u0026nbsp;figür\u0026nbsp;bir\u0026nbsp;evren,\u0026nbsp;her\u0026nbsp;aksesuar\u0026nbsp;bir\u0026nbsp;hikâyedir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71031\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"5efe69c9-32f8-499e-91f1-a7da304bb260\",\"title\":\"LEGO® Minifigürler Serisi Super Mario Character Packs 3\",\"slug_tr\":\"lego-minifigurler-serisi-super-mario-character-packs-3\",\"slug_en\":\"lego-minifigures-series-super-mario-character-packs-3\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2021\",\"category\":\"Özel Seriler\",\"category_main\":\"Özel Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"g7ekqry3z\",\"data\":{\"title\":\"Super Mario Character Packs Seri 3\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$23e\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"1-Up Mushroom, Scuttlebug, Galoomba, Bony Beetle, Torpedo Ted, Boo, Crowber, Parachute Bob-omb.\\nBoo, Mario evreninin en ikonik karakterlerinden biri olarak koleksiyonun sembolü haline geldi.\\nScuttlebug ve Crowber gibi düşmanlar, oyunun zorluk ve eğlence dengesini LEGO dünyasına taşıdı.\\n1-Up Mushroom ise klasik “ekstra hayat” özelliğini temsil eden nostaljik bir detay olarak öne çıktı.\",\"box2Content\":\"LEGO’nun Super Mario evrenindeki dengeyi mükemmel kurduğu dönemdir.\\nHer figür, hem oynanabilirlik hem de tasarım açısından ayrı bir hikâye anlatır.\\nLEGO, bu seriyle birlikte oyun dünyasındaki duyguyu minifigür boyutuna başarıyla taşımıştır.\",\"box3Content\":\"Super Mario Character Packs Seri 3, nostaljiyle inovasyonun birleştiği, interaktif deneyimin en eğlenceli halidir.\\nMario evrenini LEGO dokunuşuyla yaşamak isteyen herkes için vazgeçilmez bir seridir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eBoo\u0026nbsp;ve\u0026nbsp;1-Up\u0026nbsp;Mushroom,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;popüler\u0026nbsp;karakterleri\u0026nbsp;arasında\u0026nbsp;yer\u0026nbsp;alır.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;3,\u0026nbsp;oyun\u0026nbsp;atmosferini\u0026nbsp;koleksiyon\u0026nbsp;estetiğiyle\u0026nbsp;buluşturarak\u0026nbsp;LEGO\u0026nbsp;tarihindeki\u0026nbsp;en\u0026nbsp;güçlü\u0026nbsp;Nintendo\u0026nbsp;uyarlamalarından\u0026nbsp;birine\u0026nbsp;dönüşmüştür.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71394\",\"rarity\":\"Yaygın\",\"figure_count\":10,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"4652d019-a77e-4b71-a86a-d78c77d53549\",\"title\":\"LEGO® Minifigürler Serisi Looney Tunes\",\"slug_tr\":\"lego-minifigurler-serisi-looney-tunes\",\"slug_en\":\"lego-minifigures-series-looney-tunes\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2021\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"7db6x3kws\",\"data\":{\"title\":\"Looney Tunes\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$23f\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Bugs Bunny, Daffy Duck, Porky Pig, Petunia Pig, Tweety, Sylvester, Road Runner, Wile E. Coyote, Tasmanian Devil, Lola Bunny, Marvin the Martian, Speedy Gonzales.\\nBugs Bunny, havuç aksesuarı ve rahat tavrıyla serinin kalbidir — “What’s up, doc?” ruhu birebir yansıtılmıştır.\\nDaffy Duck, abartılı yüz ifadesiyle LEGO’nun mizah anlayışına mükemmel uyum sağlar.\\nRoad Runner ve Wile E. Coyote ikilisi, klasik kovalamacanın LEGO versiyonunu sunar.\\nTasmanian Devil ise döner stand aksesuarı ve baskı detaylarıyla koleksiyonun en dinamik figürlerinden biridir.\",\"box2Content\":\"LEGO’nun çocukluğun sesini duyurduğu andır.\\nHer figür, bir kahkaha anısının minyatür halidir.\\nLEGO burada yalnızca bir lisansı değil, bir çağın mizahını yeniden canlandırmıştır.\",\"box3Content\":\"Looney Tunes Serisi, LEGO’nun nostaljiyi eğlenceyle harmanladığı bir başyapıttır.\\nAnimasyonun altın çağını minifigür formunda yaşatırken, her karakteri zamansız bir ikona dönüştürür.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eBugs\u0026nbsp;Bunny\u0026nbsp;ve\u0026nbsp;Tasmanian\u0026nbsp;Devil,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;öne\u0026nbsp;çıkan\u0026nbsp;karakterlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eLooney\u0026nbsp;Tunes\u0026nbsp;Serisi,\u0026nbsp;sade\u0026nbsp;ama\u0026nbsp;güçlü\u0026nbsp;detaylarıyla\u0026nbsp;LEGO’nun\u0026nbsp;“gülümseten\u0026nbsp;koleksiyon”\u0026nbsp;döneminin\u0026nbsp;simgesidir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71030\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"a1f7575c-15fd-45b2-8d38-b4c2adc7fa86\",\"title\":\"LEGO® Minifigürler Serisi VIDIYO Bandmates\",\"slug_tr\":\"lego-minifigurler-serisi-vidiyo-bandmates\",\"slug_en\":\"lego-minifigures-series-vidiyo-bandmates\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2021\",\"category\":\"Özel Seriler\",\"category_main\":\"Özel Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"9nez590b7\",\"data\":{\"title\":\"VIDIYO Bandmates Seri 1\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$240\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"DJ Cheetah, Alien DJ, Shark Singer, Red Panda Dancer, Cotton Candy Cheerleader, Discowgirl, Bunny Dancer, Samurapper.\\nDJ Cheetah ve Alien DJ, elektronik müzik temasını temsil eden dinamik tasarımlarıyla dikkat çekti.\\nShark Singer, LEGO’nun eğlenceli sahne kostümü geleneğini devam ettirirken; Red Panda Dancer ve Cotton Candy Cheerleader figürleri renkli enerjisiyle seriye pozitif bir hava kattı.\\nHer karakter, LEGO’nun “herkesin sahnesi farklıdır” felsefesini vurguluyor.\",\"box2Content\":\"LEGO’nun sanatı, müziği ve teknolojiyi birleştirdiği andır.\\nArtık minifigürler sadece karakter değil; birer sanatçı, DJ veya dansçı kimliğine sahiptir.\\nLEGO bu seride eğlenceyi koleksiyonun kalbine yerleştirmiştir.\",\"box3Content\":\"VIDIYO Bandmates Seri 1, LEGO’nun müzikle dijital çağ arasında kurduğu köprüdür.\\nHer figür, farklı bir müzik tarzını ve sahne kültürünü temsil eder.\\nBu yönüyle seri, klasik koleksiyonculuğun ötesine geçip sanatsal bir deneyime dönüşür.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eDJ\u0026nbsp;Cheetah\u0026nbsp;ve\u0026nbsp;Shark\u0026nbsp;Singer,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;öne\u0026nbsp;çıkan\u0026nbsp;figürleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;1,\u0026nbsp;LEGO’nun\u0026nbsp;sahne\u0026nbsp;ruhunu\u0026nbsp;yakaladığı,\u0026nbsp;koleksiyonculuğu\u0026nbsp;müzikle\u0026nbsp;harmanladığı\u0026nbsp;ilk\u0026nbsp;adımdır\u0026nbsp;—\u0026nbsp;ritmi\u0026nbsp;olan\u0026nbsp;bir\u0026nbsp;koleksiyon.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"43101\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"5e685ed1-8e8e-448f-9814-aff68a364179\",\"title\":\"LEGO® Minifigürler Serisi Super Mario Character Packs 2\",\"slug_tr\":\"lego-minifigurler-serisi-super-mario-character-packs-2\",\"slug_en\":\"lego-minifigures-series-super-mario-character-packs-2\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2021\",\"category\":\"Özel Seriler\",\"category_main\":\"Özel Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"lapb7l6vb\",\"data\":{\"title\":\"Super Mario Character Packs Seri 2\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$241\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Bone Goomba, Poison Mushroom, Huckit Crab, Para-Beetle, Ninji, Fly Guy, Spiny Cheep Cheep, Thwimp.\\nNinji, klasik Mario düşmanlarının nostaljik temsilcilerinden biri olarak koleksiyonun yıldızıdır.\\nPoison Mushroom, oyunlarda tehlikeyi simgeleyen bir unsurken LEGO formunda eğlenceli bir sürpriz haline gelir.\\nThwimp ve Fly Guy gibi figürler, seriye aksiyon dolu bir hava katar.\\nBone Goomba ise karakteristik iskelet tasarımıyla detay seviyesini yükseltir.\",\"box2Content\":\"LEGO’nun Super Mario iş birliğinde “oyun deneyimini koleksiyona dönüştürdüğü” noktadır.\\nHer karakter, sadece bir düşman değil; bir dönemin oyun atmosferini temsil eden hatıradır.\",\"box3Content\":\"Super Mario Character Packs Seri 2, oyun tarihine yön vermiş karakterleri LEGO dünyasında yeniden canlandıran bir seridir.\\nİnteraktif özellikleri, nostaljik figürleri ve renkli yapısıyla hem çocuklara hem yetişkin hayranlara hitap eder.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eNinji\u0026nbsp;ve\u0026nbsp;Bone\u0026nbsp;Goomba,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;dikkat\u0026nbsp;çeken\u0026nbsp;figürleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;2,\u0026nbsp;hem\u0026nbsp;tasarım\u0026nbsp;kalitesi\u0026nbsp;hem\u0026nbsp;de\u0026nbsp;oyunla\u0026nbsp;bütünleşen\u0026nbsp;yapısıyla\u0026nbsp;Super\u0026nbsp;Mario\u0026nbsp;evreninin\u0026nbsp;LEGO’daki\u0026nbsp;en\u0026nbsp;enerjik\u0026nbsp;yansımalarından\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71386\",\"rarity\":\"Yaygın\",\"figure_count\":10,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"7161773d-82e9-46f5-830f-6a2037c713a2\",\"title\":\"LEGO® Minifigürler Serisi Super Mario Character Packs\",\"slug_tr\":\"lego-minifigurler-serisi-super-mario-character-packs\",\"slug_en\":\"lego-minifigures-series-super-mario-character-packs\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2020\",\"category\":\"Özel Seriler\",\"category_main\":\"Özel Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"hs4jlfgfi\",\"data\":{\"title\":\"Super Mario Character Packs Seri 1\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$242\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Blooper, Bob-omb, Bullet Bill, Spiny, Goomba, Fuzzy, Eep Cheep, Peepa, Buzzy Beetle, Paragoomba.\\nGoomba, klasik Super Mario düşmanlarının en tanınanı olarak koleksiyonun sembolüdür.\\nBullet Bill, uçan tasarımıyla sahneye hareket ve dinamizm kazandırır.\\nBob-omb, patlayıcı enerjisiyle serinin en eğlenceli figürlerinden biridir.\\nPeepa ve Fuzzy gibi karakterler ise oyunun mizahi korku atmosferini LEGO tarzında yansıtır.\",\"box2Content\":\"LEGO’nun “oyun deneyimini elde tutulur hale getirdiği” andır.\\nHer figür, yalnızca bir düşman değil, bir seviyenin, bir mücadele anısının ve bir oyunculuk duygusunun sembolüdür.\\nBu seriyle LEGO, dijital dünyayı fiziksel oyunla buluşturmayı başardı.\",\"box3Content\":\"Super Mario Character Packs Seri 1, LEGO’nun video oyun dünyasına açtığı kapıdır.\\nHem nostaljik hem yenilikçi yapısıyla, hem koleksiyon hem oyun deneyimi sunan öncü bir seridir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eGoomba\u0026nbsp;ve\u0026nbsp;Bob-omb,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;ikonik\u0026nbsp;karakterleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;1,\u0026nbsp;LEGO’nun\u0026nbsp;oyun\u0026nbsp;evrenine\u0026nbsp;attığı\u0026nbsp;ilk\u0026nbsp;adım\u0026nbsp;olarak\u0026nbsp;koleksiyon\u0026nbsp;tarihine\u0026nbsp;geçti\u0026nbsp;—\u0026nbsp;her\u0026nbsp;parçası,\u0026nbsp;Mario\u0026nbsp;evreninin\u0026nbsp;bir\u0026nbsp;hatırasıdır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71361\",\"rarity\":\"Yaygın\",\"figure_count\":10,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"01c8d782-ea99-468b-bf66-6688dd422a0d\",\"title\":\"LEGO® Minifigürler Serisi Harry Potter 2\",\"slug_tr\":\"lego-minifigurler-serisi-harry-potter-2\",\"slug_en\":\"lego-minifigures-series-harry-potter-2\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2020\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"nhzs2c5dg\",\"data\":{\"title\":\"Harry Potter Seri 2\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$243\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Harry Potter (Marauder’s Map), Ron Weasley (Quidditch Kupası), Hermione Granger (Time Turner), Luna Lovegood (Aslan Şapka), Ginny Weasley, Fred Weasley, George Weasley, Moaning Myrtle, Professor Sprout, Albus Dumbledore (Elder Wand), Bellatrix Lestrange, Griphook, Kingsley Shacklebolt, Lily Potter, James Potter.\\nHarry, elindeki Marauder’s Map (Hırsız Haritası) ile Hogwarts’ın gizemli tarafını temsil eder.\\nHermione, Time Turner kolyesiyle zaman yolculuğunun simgesidir.\\nLuna’nın aslan başlığı, onun cesur ama farklı kişiliğini yansıtır.\\nFred ve George Weasley ikilisi, serinin mizahi ruhunu canlı tutarken; Dumbledore’un Elder Wand detayı koleksiyonun mistik gücünü artırır.\\nMoaning Myrtle, özel şeffaf mavi kalıbıyla benzersiz bir yapıya sahiptir.\",\"box2Content\":\"LEGO’nun büyü dünyasındaki anlatımını karakter derinliğiyle zenginleştirdiği dönemdir.\\nArtık her figür yalnızca bir büyücü değil, bir hikâyenin duygusal parçasıdır.\\nLEGO bu koleksiyonla “büyünün ötesinde bağ” temasını öne çıkarır.\",\"box3Content\":\"Harry Potter Seri 2, büyü dünyasının olgunluk dönemini yansıtan duygusal ve detaylı bir koleksiyondur.\\nKostüm kalitesi, aksesuar seçimi ve film göndermeleriyle LEGO’nun en incelikli serilerinden biridir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eLuna\u0026nbsp;Lovegood\u0026nbsp;(Aslan\u0026nbsp;Şapka)\u0026nbsp;ve\u0026nbsp;Dumbledore\u0026nbsp;(Elder\u0026nbsp;Wand)\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;çok\u0026nbsp;aranan\u0026nbsp;figürleri\u0026nbsp;arasındadır.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;2,\u0026nbsp;LEGO’nun\u0026nbsp;hikâye\u0026nbsp;anlatımında\u0026nbsp;ulaştığı\u0026nbsp;duygusal\u0026nbsp;derinliği\u0026nbsp;büyüyle\u0026nbsp;birleştirdiği\u0026nbsp;özel\u0026nbsp;bir\u0026nbsp;başyapıttır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71028\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"4864abcf-2dc6-47bc-9632-bb6731f24c2f\",\"title\":\"LEGO® Minifigürler Serisi DC Comics\",\"slug_tr\":\"lego-minifigurler-serisi-dc-comics\",\"slug_en\":\"lego-minifigures-series-dc-comics\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2020\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"rqm8n7p06\",\"data\":{\"title\":\"DC Comics\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$244\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Batman (Classic 1980s), Superman, Wonder Woman (Golden Age), The Flash (Jay Garrick), Green Lantern, Aquaman, Cyborg, Huntress, Metamorpho, Cheetah, Sinestro, Stargirl, Mister Miracle, Bumblebee.\\nGolden Age Wonder Woman, klasik kostümüyle DC tarihine nostaljik bir gönderme yapar.\\nJay Garrick versiyonu The Flash, altın çağı temsil eden nadir bir karakter seçimidir.\\nMetamorpho ve Mister Miracle gibi figürler, LEGO’nun çizgi roman kültürüne olan derin hakimiyetini gösterir.\\nBumblebee ve Huntress ise güçlü kadın karakterlerin serideki varlığını pekiştirir.\",\"box2Content\":\"LEGO’nun “çizgi roman sayfasını tuğlaya dönüştürdüğü” andır.\\nHer karakter, kahramanlık temasının farklı bir yönünü temsil eder: cesaret, umut, fedakârlık ya da adalet.\\nLEGO bu koleksiyonda sadece kahramanları değil, onların ideallerini de minyatürleştirmiştir.\",\"box3Content\":\"DC Comics Serisi, LEGO’nun süper kahraman türüne sanatsal bir yorum kattığı eşsiz bir koleksiyondur.\\nKlasik çizgi roman atmosferi, özel stand tasarımı ve detaylı baskılarla koleksiyon tarihinde ayrıcalıklı bir yere sahiptir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eGolden\u0026nbsp;Age\u0026nbsp;Wonder\u0026nbsp;Woman\u0026nbsp;ve\u0026nbsp;Jay\u0026nbsp;Garrick\u0026nbsp;Flash,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;özel\u0026nbsp;karakterlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri,\u0026nbsp;hem\u0026nbsp;klasik\u0026nbsp;hayranlara\u0026nbsp;hem\u0026nbsp;modern\u0026nbsp;koleksiyonerlere\u0026nbsp;hitap\u0026nbsp;eden\u0026nbsp;kusursuz\u0026nbsp;bir\u0026nbsp;denge\u0026nbsp;sunar\u0026nbsp;—\u0026nbsp;LEGO’nun\u0026nbsp;kahramanlar\u0026nbsp;çağı\u0026nbsp;burada\u0026nbsp;başlar.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71026\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"a359850a-0d06-4ebc-9339-d5442626bcde\",\"title\":\"LEGO® Minifigürler Serisi Disney 2\",\"slug_tr\":\"lego-minifigurler-serisi-disney-2\",\"slug_en\":\"lego-minifigures-series-disney-2\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2019\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"jvq1pheiz\",\"data\":{\"title\":\"Disney 2\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$245\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Mickey Mouse (Steamboat Willie), Minnie Mouse (Steamboat Willie), Scrooge McDuck, Huey, Dewey, Louie, Chip, Dale, Elsa, Anna, Jafar, Jasmine, Hades, Hercules, Edna Mode, Frozone, Sally, Jack Skellington.\\nMickey ve Minnie’nin siyah-beyaz Steamboat Willie versiyonları, Disney tarihinin başlangıcına nostaljik bir selam niteliğindedir.\\nScrooge McDuck ve yeğenleri Huey, Dewey, Louie; Disney’in televizyon çağını LEGO dilinde yaşatır.\\nHades ve Hercules figürleri, mitolojik temaları renkli biçimde yansıtırken, Elsa ve Anna modern Disney döneminin zarafetini temsil eder.\\nEdna Mode ve Frozone ise Pixar tarafının mizahi enerjisini seriye taşır.\",\"box2Content\":\"LEGO’nun Disney sevgisini tarihsel bir yolculuğa dönüştürdüğü andır.\\nHer karakter, Disney’in farklı çağlarını ve duygularını koleksiyon formunda ölümsüzleştirir.\\nBu seri, “çocukluğumuzun kahramanlarını bugüne taşıyan” bir köprü gibidir.\",\"box3Content\":\"Disney Seri 2, LEGO’nun masal anlatımında ulaştığı duygusal olgunluğun simgesidir.\\nKlasiklerden modernlere uzanan bu koleksiyon, nostaljiyle çağdaşlığı aynı vitrine sığdırır.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSteamboat\u0026nbsp;Willie\u0026nbsp;Mickey\u0026nbsp;ve\u0026nbsp;Hades,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;ikonik\u0026nbsp;figürlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;2,\u0026nbsp;Disney’in\u0026nbsp;her\u0026nbsp;dönemini\u0026nbsp;kapsayan\u0026nbsp;geniş\u0026nbsp;karakter\u0026nbsp;seçkisiyle\u0026nbsp;koleksiyon\u0026nbsp;tarihindeki\u0026nbsp;en\u0026nbsp;duygusal\u0026nbsp;lisanslı\u0026nbsp;işlerden\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71024\",\"rarity\":\"Nadir\",\"figure_count\":18,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"010c1fc6-fd49-4f2d-9839-e7545792cc25\",\"title\":\"LEGO® Minifigürler Serisi The Lego Movie 2\",\"slug_tr\":\"lego-minifigurler-serisi-the-lego-movie-2\",\"slug_en\":\"lego-minifigures-series-the-lego-movie-2\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2019\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"ud7xds14s\",\"data\":{\"title\":\"The LEGO Movie 2\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$246\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Apocalypseburg Lucy, Apocalypseburg Emmet, Rex Dangervest, Unikitty (Ultrakatty), Benny, Dorothy Gale \u0026 Toto, Cowardly Lion, Scarecrow, Tin Man, President Business, Kitty Pop, Candy Rapper, Watermelon Dude, Giraffe Guy, Crayon Girl.\\nEmmet, “naif umut”un sembolü olarak serinin merkezindedir.\\nLucy (Wyldstyle), karanlık bir dünyada direniş ruhunu temsil eder.\\nRex Dangervest, mizahi şekilde Emmet’in “olmak istediği” kahramanı yansıtır.\\nDorothy ve arkadaşları (Oz karakterleri), LEGO evreninin farklı temalarla birleşim gücünü gösterir.\\nUnikitty’nin Ultrakatty formu ise karakterin dönüşümünü ve güçlenmesini simgeler.\",\"box2Content\":\"LEGO’nun “yaratıcılık karanlığa karşı” temasını en güçlü şekilde işlediği dönemdir.\\nHer karakter, bir duygunun ya da bir yolculuğun parçasıdır.\\nBu koleksiyon, sadece film hatırası değil; aynı zamanda bir büyüme hikâyesidir.\",\"box3Content\":\"The LEGO Movie 2 Serisi, LEGO’nun hikâye anlatımındaki olgunluk dönemini temsil eder.\\nRenkli karakterleri, sembolik dönüşümleri ve sinema bağlantılarıyla koleksiyon tarihinin en derin temalarından birini barındırır.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eRex\u0026nbsp;Dangervest\u0026nbsp;ve\u0026nbsp;Apocalypseburg\u0026nbsp;Lucy,\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;güçlü\u0026nbsp;karakterlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri,\u0026nbsp;mizahın\u0026nbsp;yanında\u0026nbsp;içsel\u0026nbsp;yolculuk ayal gücünün ve pozitif enerjinin birleşimiyle LEGO evreninin en sevimli köşesini oluşturur.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eAngry\u0026nbsp;Kitty\u0026nbsp;ve\u0026nbsp;Shades\u0026nbsp;Kitty,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;ikonik\u0026nbsp;versiyonlarıdır.\u0026nbsp;Unikitty!\u0026nbsp;Serisi,\u0026nbsp;klasik\u0026nbsp;figür\u0026nbsp;anlayışının\u0026nbsp;dışına\u0026nbsp;çıkarak\u0026nbsp;LEGO’nun\u0026nbsp;sanatsal\u0026nbsp;yönünü\u0026nbsp;ön\u0026nbsp;plana\u0026nbsp;taşır\u0026nbsp;—\u0026nbsp;neşe,\u0026nbsp;renk\u0026nbsp;ve\u0026nbsp;duygu\u0026nbsp;bir\u0026nbsp;arada.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"41755\",\"rarity\":\"Nadir\",\"figure_count\":12,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"bfd4719a-6803-489f-918f-516211bb4947\",\"title\":\"LEGO® Minifigürler Serisi Harry Potter and Fantastic Beasts\",\"slug_tr\":\"lego-minifigurler-serisi-harry-potter-and-fantastic-beasts\",\"slug_en\":\"lego-minifigures-series-harry-potter-and-fantastic-beasts\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2018\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"ihblnjjiz\",\"data\":{\"title\":\"Harry Potter and Fantastic Beasts\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$248\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Harry Potter, Hermione Granger, Ron Weasley, Draco Malfoy, Albus Dumbledore, Lord Voldemort, Luna Lovegood, Neville Longbottom, Cedric Diggory, Cho Chang, Dean Thomas, Mad-Eye Moody, Credence Barebone, Jacob Kowalski, Tina Goldstein, Newt Scamander, Queenie Goldstein, Percival Graves.\\nHarry, asasını ve okul cübbesini taşırken Hogwarts’ın klasik havasını LEGO dünyasında yaşatır.\\nNewt Scamander, büyü yaratıklarıyla ilgilenen çantasıyla serinin en ikonik detaylarından birine sahiptir.\\nLuna Lovegood, renkli tarzıyla büyü evreninin özgür ruhunu temsil eder.\\nPercival Graves ve Credence Barebone ise Fantastic Beasts kısmının dramatik yönünü LEGO formunda yansıtır.\",\"box2Content\":\"LEGO’nun hayal gücüyle büyünün kesiştiği noktadır.\\nHer figür, sadece bir karakter değil; bir büyü dünyasının parçasıdır.\\nBu seriyle LEGO, koleksiyonculuğu adeta sihirli bir deneyime dönüştürmüştür.\",\"box3Content\":\"Harry Potter and Fantastic Beasts Serisi, LEGO’nun büyücülük evrenini tuğlalarla ölümsüzleştirdiği koleksiyonudur.\\nİki farklı hikâyeyi aynı seride buluşturan bu çalışma, hem nostaljik hem de modern bir büyü atmosferi sunar.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eNewt\u0026nbsp;Scamander\u0026nbsp;ve\u0026nbsp;Luna\u0026nbsp;Lovegood,\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;çok\u0026nbsp;aranan\u0026nbsp;figürlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri,\u0026nbsp;detay\u0026nbsp;zenginliği,\u0026nbsp;yüz\u0026nbsp;baskıları\u0026nbsp;ve\u0026nbsp;büyü\u0026nbsp;aksesuarlarıyla\u0026nbsp;LEGO’nun\u0026nbsp;lisanslı\u0026nbsp;temalarda\u0026nbsp;ulaştığı\u0026nbsp;en\u0026nbsp;etkileyici\u0026nbsp;seviyelerden\u0026nbsp;birini\u0026nbsp;temsil\u0026nbsp;eder.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71022\",\"rarity\":\"Çok Nadir\",\"figure_count\":22,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"7f1a4015-a174-43d8-8691-f5154ee850b7\",\"titl latımıyla birleştirdiği dönemi temsil eder.\\nHer karakter, bir erdemi veya yaşam felsefesini sembolize eder.\",\"box3Content\":\"The LEGO Ninjago Movie Serisi, dostluğun, azmin ve mizahın minifigür haliyle buluştuğu, LEGO’nun ruhani aksiyon dönemidir.\\nHem film atmosferi hem karakter çeşitliliğiyle koleksiyon tarihine özel bir sayfa ekler.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eLloyd\u0026nbsp;ve\u0026nbsp;Garmadon,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;güçlü\u0026nbsp;karakterleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eKostüm\u0026nbsp;detayları\u0026nbsp;ve\u0026nbsp;özel\u0026nbsp;baskılar,\u0026nbsp;seriyi\u0026nbsp;LEGO’nun\u0026nbsp;sinematik\u0026nbsp;temalarındaki\u0026nbsp;en\u0026nbsp;zengin\u0026nbsp;koleksiyonlardan\u0026nbsp;biri\u0026nbsp;yapar.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71019\",\"rarity\":\"Çok Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"c752c3a1-edfd-473c-9035-208c41cab03b\",\"title\":\"LEGO® Minifigürler Serisi Batman Movie\",\"slug_tr\":\"lego-minifigurler-serisi-batman-movie\",\"slug_en\":\"lego-minifigures-series-batman-movie\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2017\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"zksqwtrs1\",\"data\":{\"title\":\"The LEGO Batman Movie\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$24b\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Batman (Vacation, Glam Metal, Fairy Batman), Robin, The Joker, Harley Quinn, Commissioner Gordon, Barbara Gordon, Catman, Calculator, Mime, Zodiac Master, Orca, King Tut, Eraser. Fairy Batman, mizahi tasarımıyla serinin sembolü haline geldi.\\nJoker, filmdeki teatral deliliğiyle LEGO figürlerinde görülmemiş bir yüz ifadesine kavuştu.\\nRobin’in saf sevinci ve Harley Quinn’in detaylı baskısı, serinin en çok aranan figürleri arasında yer aldı.\\nZodiac Master ve Orca gibi yan karakterler ise DC evrenine eğlenceli göndermeler sunar.\",\"box2Content\":\"LEGO’nun kahramanlık temasını parodiyle harmanladığı özel bir dönemi temsil eder.\\nBatman’in yalnızlık, mizah ve abartılı özgüven üçgeninde yeniden doğduğu bir hikâyedir bu.\\nLEGO bu seride sadece karakterleri değil, bir “ruh hâlini” minifigürleştirmiştir.\",\"box3Content\":\"The LEGO Batman Movie Serisi, hem DC evrenine mizahi bir bakış hem de LEGO sinematik kültürünün doruk noktalarından biridir.\\nKostüm çeşitliliği, renk doygunluğu ve karakter bolluğuyla koleksiyoncular için altın değerindedir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eFairy\u0026nbsp;Batman\u0026nbsp;ve\u0026nbsp;Harley\u0026nbsp;Quinn,\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;öne\u0026nbsp;çıkan\u0026nbsp;karakterleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eBatman’in\u0026nbsp;her\u0026nbsp;kostümü,\u0026nbsp;karakterin\u0026nbsp;hem\u0026nbsp;ciddi\u0026nbsp;hem\u0026nbsp;komik\u0026nbsp;yanını\u0026nbsp;mükemmel\u0026nbsp;biçimde\u0026nbsp;yansıtır.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eBu\u0026nbsp;seri,\u0026nbsp;LEGO’nun\u0026nbsp;mizah\u0026nbsp;ve\u0026nbsp;kahramanlığı\u0026nbsp;dengelediği\u0026nbsp;bir\u0026nbsp;başyapıttır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71017\",\"rarity\":\"Nadir\",\"figure_count\":20,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"67cfc14f-4501-4cf3-bdfe-ced64e98a21c\",\"title\":\"LEGO® Minifigürler Serisi DFB\",\"slug_tr\":\"lego-minifigurler-serisi-dfb\",\"slug_en\":\"lego-minifigures-series-dfb\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2016\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"q9md15yl5\",\"data\":{\"title\":\"DFB Almanya Milli Takımı\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$24c\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Manuel Neuer, Mats Hummels, Jérôme Boateng, Benedikt Höwedes, Shkodran Mustafi, Sami Khedira, Bastian Schweinsteiger, Mesut Özil, Toni Kroos, Christoph Kramer, Thomas Müller, Marco Reus, André Schürrle, Mario Götze, Max Kruse, Joachim Löw (Menajer).\\nManuel Neuer, eldivenleriyle kaleci figürlerinde eşi benzeri görülmemiş bir detay sunar.\\nMesut Özil ve Toni Kroos, orta saha zekâsını ve oyun vizyonunu temsil eder.\\nBastian Schweinsteiger, kaptan ruhu ve azmiyle koleksiyonun duygusal simgesidir.\\nTeknik direktör Joachim Löw figürü ise serinin en dikkat çeken sürprizlerinden biridir.\",\"box2Content\":\"LEGO’nun “gerçek dünyayı minifigür estetiğiyle yorumladığı” ilk sporsal başarı öyküsüdür.\\nBu koleksiyon sadece oyuncuları değil, bir dönemin futbol tutkusunu temsil eder.\\nAlman disiplini, takım ruhu ve kupa sevinci, her figürde ayrı bir hikâye anlatır.\",\"box3Content\":\"DFB Serisi, LEGO’nun spor temalı koleksiyonlarında ulaştığı en prestijli noktadır.\\nHem tarihsel değeri hem sınırlı üretimiyle koleksiyon dünyasında özel bir yere sahiptir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eNeuer\u0026nbsp;ve\u0026nbsp;Özil,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;çok\u0026nbsp;aranan\u0026nbsp;figürleri\u0026nbsp;arasında\u0026nbsp;yer\u0026nbsp;alır.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eGerçek\u0026nbsp;yüz\u0026nbsp;modellemeleri\u0026nbsp;ve\u0026nbsp;özel\u0026nbsp;baskılar,\u0026nbsp;DFB\u0026nbsp;Serisini\u0026nbsp;LEGO\u0026nbsp;tarihinin\u0026nbsp;en\u0026nbsp;detaylı\u0026nbsp;lisanslı\u0026nbsp;koleksiyonlarından\u0026nbsp;biri\u0026nbsp;haline\u0026nbsp;getirir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71014\",\"rarity\":\"Çok Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"81d4377c-3b5d-43c7-9f8e-13df91a90a7f\",\"title\":\"LEGO® Minifigürler Serisi Disney\",\"slug_tr\":\"lego-minifigurler-serisi-disney\",\"slug_en\":\"lego-minifigures-series-disney\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2016\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"coxzzzhmt\",\"data\":{\"title\":\"Disney\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$24d\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Mickey Mouse, Minnie Mouse, Donald Duck, Daisy Duck, Aladdin, Genie, Ariel, Ursula, Peter Pan, Captain Hook, Stitch, Maleficent, Alice, Cheshire Cat.\\nMickey ve Minnie Mouse, Disney evreninin kalbidir.\\nKlasik tasarımlarıyla LEGO’nun karakter modellemesinde yeni bir sayfa açtılar.\\nAladdin ve Genie, 90’lar animasyonlarının ruhunu taşırken; Ariel ve Ursula, deniz altı masalının büyüsünü yaşatır.\\nMaleficent, Disney’in kötü karakterlerine kattığı zarafeti LEGO formunda temsil eder.\",\"box2Content\":\"LEGO’nun “çocukluğa saygı duruşu”dur.\\nHer figür, bir dönemi, bir filmi ya da bir hayali temsil eder.\\nLEGO bu seride sadece karakterleri değil, Disney’in yarattığı duyguları da minyatürleştirmiştir.\",\"box3Content\":\"Disney Serisi, LEGO’nun hikâye anlatımındaki en duygusal duraklarından biridir.\\nKültür, masal ve koleksiyonun kesişim noktası olan bu seri, hem eski Disney hayranlarını hem de yeni nesil koleksiyoncuları büyüler.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eMickey\u0026nbsp;Mouse\u0026nbsp;ve\u0026nbsp;Maleficent,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;simgesel\u0026nbsp;figürleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eSeri\u0026nbsp;1,\u0026nbsp;Disney\u0026nbsp;ruhunu\u0026nbsp;LEGO\u0026nbsp;estetiğiyle\u0026nbsp;buluşturarak\u0026nbsp;“hayal\u0026nbsp;gücüyle\u0026nbsp;oynanabilir\u0026nbsp;nostalji”nin\u0026nbsp;en\u0026nbsp;güzel\u0026nbsp;örneklerinden\u0026nbsp;biri\u0026nbsp;olmuştur.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71012\",\"rarity\":\"Çok Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"4c8a2f20-951d-4f04-906f-39a685a90ec2\",\"title\":\"LEGO® Minifigürler Serisi The Simpsons 2\",\"slug_tr\":\"lego-minifigurler-serisi-the-simpsons-2\",\"slug_en\":\"lego-minifigures-series-the-simpsons-2\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2015\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"3kk9pquvl\",\"data\":{\"title\":\"The Simpsons 2\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$24e\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Bartman, Fallout Boy (Milhouse), Comic Book Guy, Professor Frink, Edna Krabappel, Patty, Selma, Waylon Smithers, Groundskeeper Willie, Martin Prince, Dr. Hibbert, Hans Moleman.\\nBartman, Bart’ın süper kahraman kimliğiyle serinin eğlenceli tarafını temsil eder.\\nComic Book Guy, dizinin geek kültürüne yaptığı göndermeyi LEGO’da somutlaştırır.\\nEdna Krabappel, klasik öğretmen figürüyle nostalji yaratır.\\nHans Moleman ve Dr. Hibbert gibi karakterler ise dizinin kara mizah yönünü LEGO tarzında yansıtır.\",\"box2Content\":\"LEGO’nun bir hikâyeyi sadece ana karakterlerle değil, yan figürlerle de zenginleştirme gücünü gösterdiği andır.\\nArtık Springfield sadece bir aile değil, tam bir dünya haline gelmiştir.\\nHer figür, dizinin farklı bir mizah tonunu temsil eder.\",\"box3Content\":\"The Simpsons Seri 2, LEGO’nun karakter derinliğini artırarak pop kültür adaptasyonunda ulaştığı olgunluk seviyesidir.\\nHer karakter, dizinin ironik, duygusal ve eğlenceli yanlarını minifigür boyutunda yaşatır.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eBartman\u0026nbsp;ve\u0026nbsp;Comic\u0026nbsp;Book\u0026nbsp;Guy,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;ikonik\u0026nbsp;figürleridir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eÖzel\u0026nbsp;baskılar,\u0026nbsp;yeni\u0026nbsp;kafa\u0026nbsp;kalıpları\u0026nbsp;ve\u0026nbsp;karakter\u0026nbsp;çeşitliliğiyle\u0026nbsp;Seri\u0026nbsp;2,\u0026nbsp;Springfield\u0026nbsp;dünyasının\u0026nbsp;LEGO’daki\u0026nbsp;tamamlayıcısı\u0026nbsp;olmuştur.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71009\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"cd4b1d5d-7da1-4b73-bca4-955060cb0e7e\",\"title\":\"LEGO® Minifigürler Serisi The Simpsons\",\"slug_tr\":\"lego-minifigurler-serisi-the-simpsons\",\"slug_en\":\"lego-minifigures-series-the-simpsons\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2014\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"9l3u2tzwk\",\"data\":{\"title\":\"The Simpsons\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$24f\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Homer Simpson, Marge Simpson, Bart Simpson, Lisa Simpson, Maggie Simpson, Ned Flanders, Krusty the Clown, Itchy, Scratchy, Apu Nahasapeemapetilon, Chief Wiggum, Mr. Burns.\\nHomer elindeki donut ve kahvesiyle, LEGO mizahının en sade ama etkili halini temsil eder.\\nMarge, zarif saç tasarımıyla seriye estetik bir dokunuş kazandırır.\\nBart ve Lisa, enerjileriyle serinin genç ruhunu taşır.\\nKrusty ve Mr. Burns gibi karakterler ise dizinin eleştirel mizahını LEGO formunda yeniden canlandırır.\",\"box2Content\":\"LEGO’nun “pop kültür” ile kurduğu ilk derin bağlardan biridir.\\nSadece dizinin karakterlerini değil, o dünyanın duygusunu da yaşatır.\\nThe Simpsons Serisi, LEGO’nun mizahı ve tasarımı birleştirmedeki ustalığını ortaya koyar.\",\"box3Content\":\"The Simpsons Serisi, LEGO’nun popüler kültürü koleksiyon evrenine taşıdığı efsane bir dönüm noktasıdır.\\nHem yetişkin koleksiyoncular hem de diziyi seven yeni nesil hayranlar için nostaljiyle neşeyi bir araya getirir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eHomer\u0026nbsp;ve\u0026nbsp;Krusty,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;çok\u0026nbsp;aranan\u0026nbsp;karakterlerindendir.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eRenkli\u0026nbsp;detaylar,\u0026nbsp;özel\u0026nbsp;kafa\u0026nbsp;kalıpları\u0026nbsp;ve\u0026nbsp;aksesuarlar\u0026nbsp;bu\u0026nbsp;seriyi\u0026nbsp;sıradan\u0026nbsp;bir\u0026nbsp;lisanslı\u0026nbsp;set\u0026nbsp;olmaktan\u0026nbsp;çıkarıp\u0026nbsp;koleksiyon\u0026nbsp;tarihine\u0026nbsp;yazmıştır.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71005\",\"rarity\":\"Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"c474d884-094a-4b0d-9f03-3c5435153797\",\"title\":\"LEGO® Minifigürler Serisi The Lego Movie\",\"slug_tr\":\"lego-minifigurler-serisi-the-lego-movie\",\"slug_en\":\"lego-minifigures-series-the-lego-movie\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2014\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"nr6pd0xno\",\"data\":{\"title\":\"The LEGO Movie\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$250\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Emmet, Wyldstyle, Bad Cop/Good Cop, President Business, Panda Guy, Calamity Drone, Larry the Barista, Mrs. Scratchen-Post, Marsha Queen of the Mermaids, Taco Tuesday Guy.\\nEmmet, filmin kahramanı olarak “herkesin içindeki yaratıcılığı” simgeler. Wyldstyle, özgür ruhu ve asi tarzıyla serinin dinamizmini temsil eder. President Business, düzen ve kontrol saplantısının ironik yansımasıdır. Panda Guy ve Taco Tuesday Guy gibi figürler ise LEGO’nun mizahi yönünü güçlendirir.\\n\",\"box2Content\":\"LEGO’nun kendi hikâyesini anlattığı dönemi temsil eder. Artık LEGO sadece bir oyuncak değil, kendi evreninde yaşayan bir kültürdür. Bu seri, sinema perdesiyle koleksiyon dünyasını ilk kez aynı sahnede buluşturdu.\",\"box3Content\":\"The LEGO Movie Serisi, LEGO’nun marka hikâyesini minifigür diliyle anlattığı ilk büyük yapımdır. Hem filmle birebir bağlantılı olması hem de karakter çeşitliliğiyle LEGO tarihinde özel bir yere sahiptir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eEmmet\u0026nbsp;ve\u0026nbsp;Wyldstyle,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;kalbidir.\u0026nbsp;Kostüm\u0026nbsp;detayları,\u0026nbsp;yüz\u0026nbsp;ifadeleri\u0026nbsp;ve\u0026nbsp;aksesuarlar,\u0026nbsp;film\u0026nbsp;atmosferini\u0026nbsp;LEGO\u0026nbsp;dilinde\u0026nbsp;mükemmel\u0026nbsp;biçimde\u0026nbsp;yansıtır.\u0026nbsp;The\u0026nbsp;LEGO\u0026nbsp;Movie\u0026nbsp;Serisi,\u0026nbsp;“herkes\u0026nbsp;yaratıcı\u0026nbsp;olabilir”\u0026nbsp;mesajını\u0026nbsp;taşırken,\u0026nbsp;LEGO’nun\u0026nbsp;en\u0026nbsp;büyük\u0026nbsp;sahne\u0026nbsp;performansını\u0026nbsp;temsil\u0026nbsp;eder.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71004\",\"rarity\":\"Çok Nadir\",\"figure_count\":16,\"is_published\":true,\"total_views\":0,\"title_en\":\"\"},{\"id\":\"fb7dece3-9745-453e-b37b-d85de975418d\",\"title\":\"LEGO® Minifigürler Serisi Team GB\",\"slug_tr\":\"lego-minifigurler-serisi-team-gb\",\"slug_en\":\"lego-minifigures-series-team-gb\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2012\",\"category\":\"Lisanslı Seriler\",\"category_main\":\"Lisanslı Seriler\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":  SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$25b\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Dog Sitter, Monkey King, Fright Knight, Pizza Costume Guy, Rugby Player, Galactic Bounty Hunter, Gardener, Programmer.\\nDog Sitter, LEGO tarihinde ilk kez iki köpek aksesuarı bir arada sunan figür olarak öne çıktı. Monkey King, Asya mitolojisinden esinlenen özgün bir karakter olarak koleksiyoncuların ilgisini çekti. Programmer figürü, modern dünyayı temsil eden mizahi bir detayla LEGO evrenine teknoloji temasını dahil etti. Pizza Costume Guy ise kostüm serisinin neşeli devamı niteliğindeydi.\\n\",\"box2Content\":\"LEGO’nun çağın ruhunu yakaladığı bir dönemdir. Artık her figür sadece eğlence değil, aynı zamanda bir temsil gücü taşımaktadır. Bu seride LEGO, hem kültürel çeşitliliğe hem de modern yaşamın renklerine yer verdi.\",\"box3Content\":\"Seri 19, LEGO’nun küresel hikâye anlatımında olgunluk dönemini temsil eder. Her karakter, farklı bir dünyayı, mesleği ya da duyguyu temsil eder. Bu yönüyle seri, LEGO’nun evrensel dilini güçlendirmiştir.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eMonkey\u0026nbsp;King\u0026nbsp;ve\u0026nbsp;Dog\u0026nbsp;Sitter,\u0026nbsp;bu\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;özel\u0026nbsp;karakterleridir.\u0026nbsp;Hem\u0026nbsp;kültürel\u0026nbsp;hem\u0026nbsp;duygusal\u0026nbsp;anlamlar\u0026nbsp;taşıyan\u0026nbsp;bu\u0026nbsp;figürler,\u0026nbsp;LEGO’nun\u0026nbsp;modern\u0026nbsp;çağla\u0026nbsp;kurduğu\u0026nbsp;bağın\u0026nbsp;güçlü\u0026nbsp;bir\u0026nbsp;göstergesidir.\u0026nbsp;Seri\u0026nbsp;19,\u0026nbsp;çeşitliliğiyle\u0026nbsp;öne\u0026nbsp;çıkan\u0026nbsp;en\u0026nbsp;dengeli\u0026nbsp;serilerden\u0026nbsp;biridir.\u003c/span\u003e\u003c/p\u003e\",\"imageTopRight\":\"\",\"imageBottomLeft\":\"\",\"imageBottomRight\":\"\"},\"type\":\"SERIES_SHOWCASE\",\"order\":0}],\"series_no\":\"71025\",\"rarity\":\"Yaygın\",\"figure_count\":16,\"is_published\":true,\"total_views\":1,\"title_en\":\"\"},{\"id\":\"8b856c69-0d85-4ff7-bbc0-898a538e21bf\",\"title\":\"LEGO® Minifigürler Serisi 18\",\"slug_tr\":\"lego-minifigurler-serisi-18\",\"slug_en\":\"lego-minifigures-series-18\",\"description\":null,\"description_blocks_en\":[],\"is_active\":true,\"release_year\":\"2018\",\"category\":\"Koleksiyon Serileri\",\"category_main\":\"Koleksiyon Serileri\",\"cover_image_url\":null,\"hero_image_url\":null,\"content_blocks\":[{\"id\":\"mn8n8uq9j\",\"data\":{\"title\":\"Kutlama Zamanı\",\"subtitle\":\"\",\"box1Title\":\"ÖNE ÇIKAN FİGÜRLER\",\"box2Title\":\"BİZİM İÇİN BU SERİ\",\"box3Title\":\"KISACASI\",\"longStory\":\"$25c\",\"quoteTitle\":\"Koleksiyoner Yorumu\",\"box1Content\":\"Classic Policeman, Cactus Girl, Party Clown, Firework Guy, Race Car Guy, Unicorn Guy, Birthday Cake Guy, Dragon Suit Guy.\\nClassic Policeman, LEGO’nun 1978’deki ilk minifigürlerinden birinin modern yorumu olarak serinin en nostaljik karakteriydi. Cactus Girl ve Firework Guy gibi figürler, seriye renk ve eğlence kattı. Birthday Cake Guy ise kutlamanın kalbinde yer alan mizahi bir karakter olarak öne çıktı.\\n\",\"box2Content\":\"LEGO’nun kendi geçmişine duyduğu saygıyı en eğlenceli şekilde kutladığı andır. Her figür, 40 yıllık bir hikâyenin parçası gibidir. LEGO, bu seriyle hem köklerine selam gönderdi hem de “kutlama” temasını evrensel bir neşeye dönüştürdü.\",\"box3Content\":\"Seri 18, LEGO tarihinin dönüm noktalarından biridir. Hem nostaljik hem eğlenceli yapısıyla markanın yarım asra yaklaşan kültürünü simgeler. Bu seri, sadece bir koleksiyon değil; LEGO’nun kendine yazdığı bir teşekkür mektubudur.\",\"imageTopLeft\":\"\",\"quoteContent\":\"\u003cp\u003e\u003cspan style=\\\"background-color: transparent; color: rgb(0, 0, 0);\\\"\u003eClassic\u0026nbsp;Policeman,\u0026nbsp;serinin\u0026nbsp;en\u0026nbsp;sembolik\u0026nbsp;figürüdür.\u0026nbsp;Hem\u0026nbsp;geçmişe\u0026nbsp;bağlılığı\u0026nbsp;hem\u0026nbsp;de\u0026nbsp;yen
